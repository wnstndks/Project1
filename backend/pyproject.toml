[project]
name = "asset-manager-backend"
version = "0.1.0"
description = "Asset manager API: US stocks + crypto holdings, LSTM price prediction, Monte Carlo projection"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "yfinance>=0.2.50",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "torch>=2.4",
    "anthropic>=1.15.0",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "httpx2>=2.14.0",
    "pytest>=8.2",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
# The local alembic/ migrations folder would otherwise make ruff treat the package as first-party.
known-third-party = ["alembic"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.File"]

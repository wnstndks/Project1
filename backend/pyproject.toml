[project]
name = "asset-manager-backend"
version = "0.1.0"
description = "Asset manager API: US stocks + crypto holdings, LSTM price prediction, Monte Carlo projection"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "yfinance>=0.2.50",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "anthropic>=1.15.0",
    "python-multipart>=0.0.32",
    "httpx2>=2.14.0",
    "exchange-calendars>=4.5",
    "pypdf>=6.21.2",
]

[dependency-groups]
dev = [
    "httpx2>=2.14.0",
    "pytest>=8.2",
    "ruff>=0.6",
]
ml = [
    "lightgbm>=4.7",
    "transformers>=4.46",
]
# The old LSTM comparison model (app/ml, /api/predictions). Its own group so the deployment
# image can leave torch out (DECISIONS.md D-035); local development and CI still install it.
lstm = [
    "torch>=2.4",
]

[tool.uv]
# A plain `uv sync` installs every group, exactly as before `lstm` was split out.
# `ml` (transformers, forecasting libs) is heavy; CI syncs with --no-group ml and uses fakes.
# The Docker image syncs with --no-default-groups: no torch, transformers, lightgbm, pytest, ruff.
default-groups = ["dev", "ml", "lstm"]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
# The local alembic/ migrations folder would otherwise make ruff treat the package as first-party.
known-third-party = ["alembic"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.File"]

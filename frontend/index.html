<!doctype html>
<html lang="ko" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asset Manager</title>
    <!-- Preset the saved theme before the first paint (same key as src/lib/theme.tsx); light by default.
         A same-origin file, never an inline script: the deployed CSP is script-src 'self'. No
         async/defer/module, so it runs before the body is drawn. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      # Keep `uv run` from re-syncing the default groups, which would pull in the heavy `ml` group.
      UV_NO_SYNC: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked --no-group ml
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Migrations match models
        run: |
          uv run alembic upgrade head
          uv run alembic check
        env:
          AM_DATABASE_URL: sqlite:///ci.db
      - name: Test
        run: uv run pytest
      - name: OpenAPI schema is up to date
        run: |
          uv run python -m app.export_openapi ../frontend/src/api/openapi.json
          git diff --exit-code ../frontend/src/api/openapi.json || {
            echo "::error::Run 'npm run gen:api' in frontend/ and commit the result"; exit 1; }

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
